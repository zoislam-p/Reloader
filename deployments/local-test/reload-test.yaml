apiVersion: v1
kind: Namespace
metadata:
  name: reloader-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reloader-test-config
  namespace: reloader-test
data:
  MESSAGE: before-reload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader-test-app
  namespace: reloader-test
  annotations:
    configmap.reloader.stakater.com/reload: "reloader-test-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reloader-test-app
  template:
    metadata:
      labels:
        app: reloader-test-app
    spec:
      containers:
        - name: test-app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: reloader-test-config
                  key: MESSAGE
